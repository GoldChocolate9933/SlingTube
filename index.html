<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SlingTube</title>
  <link rel="shortcut icon" href="assets/Images/icon.ico" type="image/x-icon">
  <link rel="icon" href="assets/Images/icon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      font-family: Arial, Helvetica, sans-serif;
      color: #cccccc;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    .page-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #222222;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .title-section h1 {
      font-weight: 700;
      font-size: 1.4rem;
      color: #ffffff;
    }

    .video-count-badge {
      background: #1a1a1a;
      border: 1px solid #333333;
      padding: 0.2rem 0.7rem;
      border-radius: 2px;
      font-weight: 600;
      font-size: 0.7rem;
      color: #999999;
    }

    .refresh-btn {
      background: #1a1a1a;
      border: 1px solid #333333;
      padding: 0.4rem 1rem;
      border-radius: 2px;
      font-weight: 600;
      font-size: 0.75rem;
      color: #999999;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .refresh-btn:hover {
      border-color: #555555;
      color: #cccccc;
      background: #222222;
    }

    .refresh-btn:active {
      background: #111111;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin: 0.5rem 0 2rem;
    }

    .video-card {
      background: #111111;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #1a1a1a;
      cursor: pointer;
    }

    .video-card:hover {
      border-color: #444444;
    }

    .video-card:active {
      opacity: 0.8;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0d0d0d;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-icon-overlay {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .video-card:hover .play-icon-overlay {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.85);
    }

    .video-info {
      padding: 0.7rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      border-top: 1px solid #1a1a1a;
    }

    .video-title {
      font-weight: 600;
      font-size: 0.8rem;
      color: #dddddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-meta {
      font-size: 0.65rem;
      color: #666666;
      font-weight: 400;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: #111111;
      border-radius: 2px;
      border: 1px solid #1a1a1a;
      color: #666666;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: #0d0d0d;
      border-radius: 2px;
      max-width: 1300px;
      width: 100%;
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #333333;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      background: #111111;
      border-bottom: 1px solid #1a1a1a;
    }

    .modal-video-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: #cccccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }

    .close-modal-btn {
      background: #1a1a1a;
      border: 1px solid #333333;
      color: #999999;
      font-size: 0.9rem;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      font-weight: 600;
    }

    .close-modal-btn:hover {
      background: #2a2a2a;
      border-color: #555555;
      color: #ffffff;
    }

    .video-player-wrapper {
      width: 100%;
      background: #000;
      display: flex;
    }

    video {
      width: 100%;
      max-height: 78vh;
      display: block;
      background: #000;
      outline: none;
    }

    .modal-footer {
      padding: 0.4rem 1rem;
      background: #111111;
      color: #555555;
      font-size: 0.6rem;
      border-top: 1px solid #1a1a1a;
      font-weight: 400;
    }

    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid #222222;
      border-top: 2px solid #666666;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.6rem;
      color: #444444;
      padding-top: 1.5rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .video-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">
  <header class="gallery-header">
    <div class="title-section">
      <h1>SlingTube</h1>
      <span id="videoCountDisplay" class="video-count-badge">0</span>
    </div>
    <button id="refreshLibraryBtn" class="refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      refresh
    </button>
  </header>

  <main id="videoGridContainer" class="video-grid">
    <div class="empty-state">
      <div class="loader"></div>
      <span>loading...</span>
    </div>
  </main>
  <footer>SlingTube</footer>
</div>

<div id="videoModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <span id="modalVideoTitle" class="modal-video-title"></span>
      <button id="closeModalBtn" class="close-modal-btn">✕</button>
    </div>
    <div class="video-player-wrapper">
      <video id="modalVideoPlayer" controls autoplay playsinline>
        <source src="" type="video/mp4">
      </video>
    </div>
    <div class="modal-footer">
      <span id="modalSourceHint"></span>
    </div>
  </div>
</div>

<script>
  (function() {
    const VIDEO_DIR = 'assets/videos/';
    const SOUNDS_DIR = 'assets/Sounds/';
    const VIDEO_EXTENSIONS = ['.mp4', '.webm', '.ogg', '.mov', '.mkv', '.avi'];

    const gridContainer = document.getElementById('videoGridContainer');
    const videoCountSpan = document.getElementById('videoCountDisplay');
    const refreshBtn = document.getElementById('refreshLibraryBtn');
    const modalOverlay = document.getElementById('videoModal');
    const modalVideoPlayer = document.getElementById('modalVideoPlayer');
    const modalVideoTitle = document.getElementById('modalVideoTitle');
    const modalSourceHint = document.getElementById('modalSourceHint');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let videoFiles = [];
    let soundPlay = null;
    let soundPause = null;
    let soundExit = null;
    let soundHover = null;
    let wasPlaying = false;

    function createSound(src) {
      const audio = new Audio();
      audio.preload = 'auto';
      audio.src = src;
      audio.volume = 0.25;
      return audio;
    }

    function loadSounds() {
      soundPlay = createSound(SOUNDS_DIR + 'play.wav');
      soundPause = createSound(SOUNDS_DIR + 'pause.mp3');
      soundExit = createSound(SOUNDS_DIR + 'exit.ogg');
      soundHover = createSound(SOUNDS_DIR + 'hover.ogg');
    }

    function playSound(audio) {
      if (!audio) return;
      const clone = audio.cloneNode();
      clone.volume = 0.25;
      clone.play().catch(() => {});
    }

    function isVideoFile(filename) {
      const lower = filename.toLowerCase();
      return VIDEO_EXTENSIONS.some(ext => lower.endsWith(ext));
    }

    function formatVideoTitle(filename) {
      const nameWithoutExt = filename.replace(/\.[^/.]+$/, '');
      return nameWithoutExt.replace(/[_-]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function createThumbnailPlaceholder(videoSrc, cardElement) {
      const tempVideo = document.createElement('video');
      tempVideo.crossOrigin = 'anonymous';
      tempVideo.preload = 'metadata';
      tempVideo.muted = true;
      tempVideo.playsInline = true;
      tempVideo.src = videoSrc;

      const fallbackTimeout = setTimeout(() => {
        const thumbImg = cardElement.querySelector('.video-thumb');
        if (thumbImg && !thumbImg.src.startsWith('data:image')) thumbImg.style.display = 'none';
      }, 1800);

      tempVideo.addEventListener('loadedmetadata', () => {
        tempVideo.currentTime = Math.min(1.0, tempVideo.duration * 0.1 || 0.5);
      });

      tempVideo.addEventListener('seeked', () => {
        clearTimeout(fallbackTimeout);
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
          const thumbImg = cardElement.querySelector('.video-thumb');
          if (thumbImg) {
            thumbImg.src = canvas.toDataURL('image/jpeg', 0.7);
            thumbImg.style.display = 'block';
          }
        } catch (e) {
          const thumbImg = cardElement.querySelector('.video-thumb');
          if (thumbImg) thumbImg.style.display = 'none';
        }
        tempVideo.remove();
      });

      tempVideo.addEventListener('error', () => {
        clearTimeout(fallbackTimeout);
        const thumbImg = cardElement.querySelector('.video-thumb');
        if (thumbImg) thumbImg.style.display = 'none';
        tempVideo.remove();
      });

      tempVideo.load();
    }

    function renderVideoGrid(videoList) {
      gridContainer.innerHTML = '';
      videoCountSpan.textContent = `${videoList.length}`;

      if (videoList.length === 0) {
        gridContainer.innerHTML = `<div class="empty-state"><span>no videos</span></div>`;
        return;
      }

      videoList.forEach(filename => {
        const videoPath = VIDEO_DIR + filename;
        const displayTitle = formatVideoTitle(filename);
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="thumbnail-container">
            <img class="video-thumb" src="" alt="" style="display:none" onerror="this.style.display='none'">
            <div class="play-icon-overlay">▶</div>
          </div>
          <div class="video-info">
            <div class="video-title" title="${displayTitle}">${displayTitle}</div>
            <div class="video-meta">${filename}</div>
          </div>`;

        card.addEventListener('mouseenter', () => {
          playSound(soundHover);
        });

        card.addEventListener('click', () => openVideoModal(filename, videoPath, displayTitle));
        gridContainer.appendChild(card);
        createThumbnailPlaceholder(videoPath, card);
      });
    }

    function openVideoModal(filename, fullPath, displayTitle) {
      modalVideoTitle.textContent = displayTitle;
      modalSourceHint.textContent = `assets/videos/${filename}`;
      const sourceEl = modalVideoPlayer.querySelector('source');
      if (sourceEl) sourceEl.setAttribute('src', fullPath);
      modalVideoPlayer.load();
      modalOverlay.classList.add('active');
      wasPlaying = false;
      modalVideoPlayer.play().then(() => {
        wasPlaying = true;
        playSound(soundPlay);
      }).catch(() => {});
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalVideoPlayer.pause();
      playSound(soundExit);
      modalVideoPlayer.currentTime = 0;
      const sourceEl = modalVideoPlayer.querySelector('source');
      if (sourceEl) sourceEl.setAttribute('src', '');
      modalVideoPlayer.load();
      wasPlaying = false;
    }

    modalVideoPlayer.addEventListener('play', () => {
      if (modalOverlay.classList.contains('active') && !wasPlaying) {
        wasPlaying = true;
        playSound(soundPlay);
      }
    });

    modalVideoPlayer.addEventListener('pause', () => {
      if (modalOverlay.classList.contains('active') && wasPlaying && !modalVideoPlayer.ended) {
        wasPlaying = false;
        playSound(soundPause);
      }
    });

    modalVideoPlayer.addEventListener('ended', () => {
      wasPlaying = false;
    });

    async function fetchVideoList() {
      try {
        const response = await fetch('videos.json');
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data)) return data.filter(f => typeof f === 'string' && isVideoFile(f));
        }
      } catch (e) {}
      return [];
    }

    async function loadAndRender() {
      gridContainer.innerHTML = `<div class="empty-state"><div class="loader"></div></div>`;
      videoFiles = await fetchVideoList();
      renderVideoGrid(videoFiles);
    }

    refreshBtn.addEventListener('click', loadAndRender);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    closeModalBtn.addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });

    loadSounds();
    loadAndRender();
  })();
</script>
</body>
</html>
